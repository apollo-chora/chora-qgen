# qgen_question — per-sub-agent model + prompt config.
#
# SINGLE-MODEL ROUTE (longcat migration): every text sub-agent of this crew
# runs the one gateway logical model longcat-2.5-preview (LongCat-2.5-Preview
# via the chora-model-gateway registry) as BOTH primary and fallback — the
# former HIGH/CHEAP model tiering has collapsed into it (the `tier` labels
# below survive only as crew-composition role names). This YAML is the single
# source of truth for each sub-agent's model. The agent sends primary_model as
# the gateway's logical_model_id and fallback_models as the agent-declared
# fallback chain (InvokeRequest.fallback_logical_model_ids); the gateway
# HONOURS it.
#
# prompt_version selects the composer template version (resolved against the
# prompt registry, falling back to embedded v1).
agent: qgen_question
sub_agents:
  assurance:
    tier: cheap
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  generation:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  evaluation:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  # qgen_generate mode=compose (ADR-254 D2/D6): the testset composer ported
  # from the kennel (orchestrators/testset_composer.py). It reads exam-paper
  # PDFs/images by reference to extract marks cues. Single-model route:
  # longcat-2.5-preview as primary and fallback.
  compose:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
