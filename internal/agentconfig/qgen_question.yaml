# qgen_question — per-sub-agent model + prompt config.
#
# AGENT-DRIVEN tiering (CR qgen 2026-06-01): this YAML is the single source of
# truth for each sub-agent's model tier. The agent sends primary_model as the
# gateway's logical_model_id and fallback_models as the agent-declared fallback
# chain (InvokeRequest.fallback_logical_model_ids); the gateway HONOURS it.
#
# The deployment's only text route is LongCat-2.5-Preview (registry entry
# `longcat-2.5-preview`, api.longcat.ai), so every sub-agent names it. The
# fallback repeats the primary deliberately: there is one provider to degrade
# to, and the gateway de-duplicates an identical (vendor, model) pair, so the
# chain collapses to a single target. Give a sub-agent a real second model the
# day the deployment has one.
#
# prompt_version selects the composer template version (resolved against the
# prompt registry, falling back to embedded v1).
agent: qgen_question
sub_agents:
  assurance:
    tier: cheap
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  generation:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  evaluation:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
  # qgen_generate mode=compose (ADR-254 D2/D6): the testset composer ported
  # from the kennel (orchestrators/testset_composer.py). It reads exam-paper
  # PDFs/images by reference to extract marks cues, so it needs the multimodal
  # tier — LongCat-2.5-Preview is vision-capable, so the same route serves it.
  compose:
    tier: high
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
