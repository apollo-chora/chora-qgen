# qgen_question — per-sub-agent tier + prompt config.
#
# AGENT-DRIVEN tiering (CR qgen 2026-06-01): this YAML declares each
# sub-agent's TIER and its prompt template version. The model itself is
# env-only: the boot layer reads the sub-agent's REQUIRED model env var as the
# gateway logical_model_id (QGEN_QUESTION_GENERATION_MODEL for generation,
# QGEN_QUESTION_COMPOSE_MODEL for the compose sub-agent) and the matching
# optional *_FALLBACK_MODELS comma list as InvokeRequest.fallback_logical_model_ids
# (the gateway HONOURS the declared chain). Boot fails loud when a required
# model var is unset, so no literal model name lives here or in the code.
#
# prompt_version selects the composer template version (resolved against the
# prompt registry, falling back to embedded v1).
agent: qgen_question
sub_agents:
  assurance:
    tier: cheap
    prompt_version: v1
  generation:
    tier: high
    prompt_version: v1
  evaluation:
    tier: high
    prompt_version: v1
  # qgen_generate mode=compose (ADR-254 D2/D6): the testset composer ported
  # from the kennel (orchestrators/testset_composer.py). It reads exam-paper
  # PDFs/images by reference to extract marks cues, so its route must be
  # multimodal-capable — the route is env-provided like every other sub-agent's.
  compose:
    tier: high
    prompt_version: v1
