# qgen_critic — per-sub-agent model + prompt config.
#
# SINGLE-MODEL ROUTE (longcat migration): the critic runs the one gateway
# logical model longcat-2.5-preview (LongCat-2.5-Preview via the
# chora-model-gateway registry) as BOTH primary and fallback — the former
# CHEAP text tier collapsed into it. It sends primary_model as the gateway
# logical_model_id + fallback_models as the agent-declared fallback chain.
#
#   critic → longcat-2.5-preview → longcat-2.5-preview
agent: qgen_critic
sub_agents:
  critic:
    tier: cheap
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
