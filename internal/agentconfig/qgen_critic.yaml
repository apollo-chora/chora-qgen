# qgen_critic — per-sub-agent tier + prompt config.
#
# AGENT-DRIVEN tiering (CR qgen 2026-06-01): the critic is the cheap text tier
# (a fast accept/reject + revision-notes judge over a single candidate). Its
# gateway logical_model_id comes from the REQUIRED QGEN_CRITIC_MODEL env var and
# its declared fallback chain from the optional QGEN_CRITIC_FALLBACK_MODELS
# comma list; boot fails loud when the model var is unset.
agent: qgen_critic
sub_agents:
  critic:
    tier: cheap
    prompt_version: v1
