# qgen_renderer: per-sub-agent tier + prompt config (ADR-254 D2 / D12: the
# generative scene image per chunk, ex the kennel's render_image scene path).
#
# AGENT-DRIVEN tiering: the renderer's gateway logical_model_id comes from the
# REQUIRED QGEN_RENDERER_MODEL env var (sent with response_modality=IMAGE) and
# its declared fallback chain from the optional QGEN_RENDERER_FALLBACK_MODELS
# comma list; boot fails loud when the model var is unset. prompt_version labels
# the renderer's envelope (the scene prompt itself is composed by the kennel and
# carried in the payload).
agent: qgen_renderer
sub_agents:
  renderer:
    tier: image
    prompt_version: v1
